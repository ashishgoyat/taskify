<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="todo">
            <h2>Todo</h2>
            <div id="todos"></div>
            <button>Add Todo</button>
        </div>
        <div id="progress">
            <h2>In Progress</h2>
        </div>
        <div id="review">
            <h2>Under Review</h2>
        </div>
        <div id="completed">
            <h2>Completed</h2>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
